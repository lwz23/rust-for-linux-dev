schema_version: 1
module_id: drm-panic-qr
module_title: DRM panic QR component benchmark
benchmark_track: current-tree
sample_tier: large-component
scope: component
status: planned
current_grade: unassessed
target_grade: engineering-grade
source_tree:
  workspace_root: /home/lwz/rfl-dev
  kernel_tree: /home/lwz/rfl-dev/linux
  upstream_branch: upstream/rust-next
dut:
  subsystem: drm
  c_gold_standard: /home/lwz/rfl-dev/linux/drivers/gpu/drm/drm_panic.c
  c_component_scope: >
    The QR code generator and panic-screen QR integration guarded by
    CONFIG_DRM_PANIC_SCREEN_QR_CODE.
  rust_reference: /home/lwz/rfl-dev/linux/drivers/gpu/drm/drm_panic_qr.rs
  planned_blind_first_output: pending
  rationale: >
    This benchmark intentionally widens the scope from full drivers to a panic-
    context component. It tests whether the methodology can handle no-allocation,
    panic-path, compression, and QR-encoding logic without assuming the target
    is always a standalone driver module.
build:
  config_symbols:
    - CONFIG_DRM_PANIC
    - CONFIG_DRM_PANIC_SCREEN_QR_CODE
    - CONFIG_ZLIB_DEFLATE
  rust_mode:
    - CONFIG_DRM_PANIC=y
    - CONFIG_DRM_PANIC_SCREEN_QR_CODE=y
  build_script: /home/lwz/rfl-dev/scripts/build-kernel.sh
validation:
  runtime_status: gap
  current_gap: >
    A panic-path validation strategy still needs to be frozen. The benchmark
    cannot claim more than static and build-side progress until a controlled
    panic-screen QR validation flow is defined.
compare_protocol:
  required:
    - freeze component boundaries inside drm_panic.c
    - perform blind-first bootstrap at component scope
    - perform hardening
    - compare with current-tree Rust reference
  focus_points:
    - panic-context no-allocation constraints
    - stack-only or caller-buffer ownership
    - QR encoder state modeling
    - integration seam with drm_panic.c
planned_outputs:
  directory: /home/lwz/rfl-dev/linux/Documentation/rust/lwz-dev/c2rust-benchmarks/drm-panic-qr
  files:
    - module_manifest.yaml
    - evaluation_report.md
    - difference_ledger.yaml
    - unsafe_audit.md
    - acceptance_checklist.md
